name: CodeQL Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Run weekly on Sundays at 12:00 UTC
    - cron: "0 12 * * 0"

permissions:
  security-events: write
  packages: read

jobs:
  codeql:
    uses: umatare5/common/.github/workflows/codeql.yml@ec6477148fb47ffc8b34a89dfdc2ec725a82863a # v0.18.0
