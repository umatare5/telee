name: CodeQL Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 12 * * 0"

# The callee declares these three at job level from v0.21.0, and a reusable
# workflow cannot be granted less than it declares: fewer scopes here fails
# the run at startup, before any job appears.
permissions:
  security-events: write
  packages: read
  contents: read

jobs:
  codeql:
    uses: umatare5/common/.github/workflows/codeql.yml@9056df6d56f55ebb1866ecb9cd24b6153e5a19f8 # v0.21.1
