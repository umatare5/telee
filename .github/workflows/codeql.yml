name: CodeQL Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Run weekly on Sundays at 12:00 UTC
    - cron: "0 12 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  security-events: write # Required for all workflows
  packages: read # Required to fetch internal or private CodeQL packs
  actions: read # Only required for workflows in private repositories
  contents: read # Only required for workflows in private repositories

jobs:
  codeql:
    uses: umatare5/common/.github/workflows/codeql.yml@8044b3c0ce0dce6411ec179c3ec0e675219c117f # v0.21.0
    with:
      # This callee is the only one defaulting to ubuntu-latest, so the
      # pin has to come from the caller until the default moves upstream
      runs_on: "ubuntu-24.04"
