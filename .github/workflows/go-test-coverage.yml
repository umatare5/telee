name: Coverage
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 2 * * 1" # every Monday at 2:00

permissions:
  contents: read

jobs:
  coverage:
    uses: umatare5/common/.github/workflows/go-test-coverage.yml@ec6477148fb47ffc8b34a89dfdc2ec725a82863a # v0.18.0
    with:
      go_version: "1.25.2"
      coverage_threshold: 0 # Minimal test coverage; increase as tests are added
