name: Release Application

on:
  push:
    branches: ["main"]
    paths: ["VERSION"]

permissions:
  contents: read

jobs:
  tagging:
    permissions:
      contents: write # pushes the annotated tag
    uses: umatare5/common/.github/workflows/tagging.yml@8044b3c0ce0dce6411ec179c3ec0e675219c117f # v0.21.0

  release:
    needs: tagging
    permissions:
      contents: write # creates the GitHub release
      packages: write # pushes the image to ghcr.io
    uses: umatare5/common/.github/workflows/go-release.yml@8044b3c0ce0dce6411ec179c3ec0e675219c117f # v0.21.0
    with:
      go_version: "1.27.1"
      goreleaser_version: "v2.18.0"
