name: Release Application

on:
  push:
    branches: ["main"]
    paths: ["VERSION"]

permissions:
  contents: read

jobs:
  tagging:
    permissions:
      contents: write # pushes the annotated tag
    uses: umatare5/common/.github/workflows/tagging.yml@9056df6d56f55ebb1866ecb9cd24b6153e5a19f8 # v0.21.1

  release:
    needs: tagging
    permissions:
      contents: write # creates the GitHub release
      packages: write # pushes the image to ghcr.io
    uses: umatare5/common/.github/workflows/go-release.yml@9056df6d56f55ebb1866ecb9cd24b6153e5a19f8 # v0.21.1
    with:
      go_version: "1.27.1"
      goreleaser_version: "v2.18.2"
