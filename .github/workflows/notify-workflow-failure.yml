name: Notify Workflow Failure

on:
  workflow_run:
    workflows:
      [
        "CodeQL Analysis",
        "Coverage",
        "Test and Build",
        "govulncheck",
        "Release Snapshot",
      ]
    types: ["completed"]

permissions:
  contents: read

jobs:
  notify:
    if: github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'failure'
    permissions:
      issues: write
    uses: umatare5/common/.github/workflows/notify-workflow-failure.yml@9056df6d56f55ebb1866ecb9cd24b6153e5a19f8 # v0.21.1
    with:
      workflow_name: ${{ github.event.workflow_run.name }}
      run_url: ${{ github.event.workflow_run.html_url }}
