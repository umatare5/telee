name: govulncheck

on:
  push:
    branches: ["main"]
    paths:
      - "go.mod"
      - "go.sum"
      - "**.go"
      - ".github/workflows/go-vulncheck.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "go.mod"
      - "go.sum"
      - "**.go"
      - ".github/workflows/go-vulncheck.yml"
  schedule:
    - cron: "30 2 * * 1" # every Monday at 2:30, clear of the three jobs already at 2:00

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # go_version is left unset, so setup-go reads go.mod rather than the "1.27.1"
  # the other Go callers pin, and a standard-library finding is reported against
  # the toolchain this module declares
  go-vulncheck:
    uses: umatare5/common/.github/workflows/go-vulncheck.yml@8044b3c0ce0dce6411ec179c3ec0e675219c117f # v0.21.0
