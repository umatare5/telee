---
# The golangci-lint rev below must match golangci_lint_version in
# .github/workflows/go-test-fmt.yml. Renovate updates the two through different
# datasources, so nothing forces them onto the same pull request.
repos:
  - repo: local
    hooks:
      - id: no-commit-to-main
        name: no-commit-to-main
        entry: scripts/no-commit-to-main.sh
        language: script
        pass_filenames: false
        always_run: true
        fail_fast: true

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.13.2
    hooks:
      # The full variant runs on the whole module, so the linters that need to
      # see every file — unused above all — report what they actually would.
      - id: golangci-lint-full

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        # The upstream hook definition omits this, and gitleaks takes a lone
        # positional argument as the repository path
        pass_filenames: false

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      # markdownlint-cli2 unions handed filenames with the globs in
      # .markdownlint-cli2.jsonc, so passing them re-lints the whole tree per batch
      - id: markdownlint-cli2
        args: ["--fix"]
        pass_filenames: false
