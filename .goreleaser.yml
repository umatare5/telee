project_name: telee
version: 2

dist: tmp/dist

github_urls:
  skip_tls_verify: false

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - main: ./cmd
    id: telee
    binary: telee
    targets:
      - linux_amd64
      - linux_arm64
      - darwin_amd64
      - darwin_arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X 'github.com/umatare5/telee/cli.version={{ .Version }}'
    hooks:
      post:
        # The setting is recorded in the binary, so this fails the release if cgo crept
        # back in. It has to stay a single command with no pipe: goreleaser runs a hook
        # without a shell, so a pipeline would be passed as arguments and assert nothing.
        - cmd: grep -q CGO_ENABLED=0 {{ .Path }}

archives:
  - name_template: "{{ .ProjectName }}-v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # SECURITY.md is named on its own because the list replaces goreleaser's own
    # defaults, and no glob here reaches a root file.
    files:
      - "README.md"
      - "SECURITY.md"
      - "LICENSE"
      - "NOTICE"
      - "docs/*.md"

# A prerelease must not move latest, the major tag or the minor tag.
dockers_v2:
  - id: exact
    images: ["ghcr.io/umatare5/telee"]
    tags: ["{{ .Tag }}"]
    platforms: ["linux/amd64", "linux/arm64"]
    dockerfile: Dockerfile
    ids: [telee]
    extra_files:
      - "LICENSE"
      - "NOTICE"
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "CLI for executing commands on network devices"
      org.opencontainers.image.url: "https://github.com/umatare5/telee"
      org.opencontainers.image.source: "https://github.com/umatare5/telee"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: "MIT"
  - id: moving
    disable: '{{ if .Prerelease }}true{{ end }}'
    images: ["ghcr.io/umatare5/telee"]
    tags:
      - "latest"
      - "v{{ .Major }}"
      - "v{{ .Major }}.{{ .Minor }}"
    platforms: ["linux/amd64", "linux/arm64"]
    dockerfile: Dockerfile
    ids: [telee]
    extra_files:
      - "LICENSE"
      - "NOTICE"
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "CLI for executing commands on network devices"
      org.opencontainers.image.url: "https://github.com/umatare5/telee"
      org.opencontainers.image.source: "https://github.com/umatare5/telee"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: "MIT"

release:
  prerelease: auto
  draft: false
  header: |
    ## {{ .ProjectName }} v{{ .Version }}

    This release contains the CLI for executing commands on network devices.

    ### Container images

    ```bash
    docker run --rm ghcr.io/umatare5/telee:{{ .Tag }} --help
    ```

    ### Binaries

    Download a prebuilt binary for your platform from the assets below.
  footer: |
    **Full Changelog**: https://github.com/umatare5/telee/compare/{{ .PreviousTag }}...{{ .Tag }}

    ### 📚 Documentation

    - [README](https://github.com/umatare5/telee/blob/{{ .Tag }}/README.md)
    - [Container Registry](https://github.com/umatare5/telee/pkgs/container/telee)

checksum:
  name_template: "{{ .ProjectName }}-v{{ .Version }}_checksums.txt"

changelog:
  use: github
  sort: asc
  abbrev: 0
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Documentation Updates
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - "^Merge branch "
      - "^release:"
      - "^ci:"
      - "^test:"

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
