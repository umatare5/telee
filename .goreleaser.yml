project_name: telee
version: 2

dist: tmp/dist

github_urls:
  skip_tls_verify: false

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - main: ./cmd
    id: telee
    binary: telee
    flags:
      - -trimpath
    targets:
      - linux_amd64
      - linux_arm64
      - darwin_amd64
      - darwin_arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X 'github.com/umatare5/telee/cli.version={{ .Version }}'
    hooks:
      post:
        # The setting is recorded in the binary, so this fails the release if cgo returns
        - cmd: grep -q CGO_ENABLED=0 {{ .Path }}

archives:
  - name_template: "{{ .ProjectName }}-v{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    # Only what a downloaded binary needs beside it: the license notices its
    # statically linked dependencies require on redistribution.
    files:
      - "LICENSE"
      - "NOTICE"

dockers_v2:
  - id: exact
    images:
      - "ghcr.io/umatare5/telee"
    tags:
      - "{{ .Tag }}"
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile
    ids:
      - telee
    # A prerelease must not move latest or the version tags. buildx builds and
    # pushes in one step, so the whole configuration is disabled instead of
    # skipping the push; snapshot builds stay enabled for local verification.
    disable: '{{ and (not .IsSnapshot) (ne .Prerelease "") }}'
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "CLI for executing commands on network devices"
      org.opencontainers.image.url: "https://github.com/umatare5/telee"
      org.opencontainers.image.source: "https://github.com/umatare5/telee"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: "MIT"
    extra_files:
      - "LICENSE"
      - "NOTICE"

  - id: moving
    images:
      - "ghcr.io/umatare5/telee"
    tags:
      - "latest"
      - "v{{ .Major }}.{{ .Minor }}"
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile
    ids: [telee]
    extra_files:
      - "LICENSE"
      - "NOTICE"
    # A prerelease must not move latest or the version tags. buildx builds and
    # pushes in one step, so the whole configuration is disabled instead of
    # skipping the push; snapshot builds stay enabled for local verification.
    disable: '{{ if .Prerelease }}true{{ end }}'
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "CLI for executing commands on network devices"
      org.opencontainers.image.url: "https://github.com/umatare5/telee"
      org.opencontainers.image.source: "https://github.com/umatare5/telee"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: "MIT"

release:
  prerelease: auto
  draft: true
  replace_existing_draft: true
  header: |
    ## {{ .ProjectName }} v{{ .Version }}

    A command-line interface that logs in to one network device and runs commands on it.

    > [!IMPORTANT]
    > A minor release may change the transcript, the exit status or a default. Read the [CHANGELOG](https://github.com/umatare5/telee/blob/{{ .Tag }}/CHANGELOG.md) before upgrading.

    ### 🐳 Container Images

    ```bash
    docker run --rm ghcr.io/umatare5/telee:{{ .Tag }} --help
    ```

    ### 📦 Binary Installation

    Download a prebuilt binary for your platform from the release assets below.
  footer: |
    **Full Changelog**: https://github.com/umatare5/telee/compare/{{ .PreviousTag }}...{{ .Tag }}

    ### 📚 Documentation

    - [README](https://github.com/umatare5/telee/blob/{{ .Tag }}/README.md)
    - [CHANGELOG](https://github.com/umatare5/telee/blob/{{ .Tag }}/CHANGELOG.md)
    - [Container Registry](https://github.com/umatare5/telee/pkgs/container/telee)

checksum:
  name_template: "{{ .ProjectName }}-v{{ .Version }}_checksums.txt"

changelog:
  use: github
  sort: asc
  abbrev: 0
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Documentation Updates
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - "^Merge branch "
      - "^release:"
      - "^ci:"
      - "^test:"

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
