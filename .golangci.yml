version: "2"

########################
# 1. Execution settings
########################
run:
  timeout: 5m                      # Keep the original timeout
  tests: true                      # Analyze *_test.go files as well
  issues-exit-code: 1              # Fail CI if any issue is found

########################
# 2. Issues quota
########################
issues:
  max-issues-per-linter: 0         # Do not cap issues per linter
  max-same-issues: 0               # Do not deduplicate identical issues
  # The default keeps one issue per line, which hides a second linter reporting the same line.
  uniq-by-line: false

########################
# 3. Enabled linters
########################
linters:
  default: none
  enable:
    # Core correctness & security
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - errchkjson
    - errorlint
    - gosec
    - goconst
    - gocritic
    - mnd
    - revive
    - unparam
    - unconvert
    - bodyclose
    - asasalint
    - misspell
    - usestdlibvars
    - perfsprint
    - paralleltest
    - tagliatelle
    - thelper
    - testpackage

    # Modernization related to Go 1.22–1.25
    - intrange               # Prefer `for i := range n` where applicable (Go 1.22) [external linter]
    - copyloopvar            # Detect legacy loop-var copies; has autofix
    - exptostd               # Suggest std replacements for x/exp/*

    # Logging hygiene (slog)
    - sloglint               # Enforce consistent slog usage
    - loggercheck            # Validate slog key/value shapes

    # API/style consistency that reduces long-term churn
    - nilnesserr             # Detect inconsistent nil/err returns
    - predeclared            # Avoid shadowing predeclared identifiers
    - godot                  # Enforce periods at the end of doc comments
    - whitespace             # Normalize whitespace
    - fatcontext             # Avoid capturing/propagating "fat" contexts
    - nosprintfhostport      # Safer host:port formatting
    - depguard               # Belt-and-suspenders dependency rules
    - forbidigo

  ########################
  # 4. Per-linter settings
  # https://golangci-lint.run/docs/linters/configuration/
  ########################
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    staticcheck:
      checks:
        - all

    errchkjson:
      check-error-free-encoding: true

    errorlint:
      errorf: true
      asserts: true

    goconst:
      min-len: 2
      min-occurrences: 3
      ignore-tests: true # Test tables enumerate the platform names; that is data, not duplication

    gocritic:
      enable-all: true
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - commentedOutCode
        - whyNoLint
        - importShadow            # Disable to avoid churn in legacy code

    mnd:
      checks: [argument, assign, case, return]
      ignored-functions: ["time.Duration"]

    revive:
      confidence: 0.8
      rules:
        - name: indent-error-flow
          arguments: [preserveScope]
        - name: function-length
          arguments: [80, 0]
        - name: error-strings
        - name: error-naming
        - name: var-naming
          arguments:
            # Argument one is revive's allowlist — these spellings are left as written;
            # argument two is its blocklist, which adds initialisms revive then requires in
            # upper case.
            - [
                "Telnet",
                "AireOS", "JunOS", "ScreenOS", "YamahaOS", "AlliedWare", "IronWare",
              ]
            - [
                "AP", "ASA", "CLI", "DHCP", "DTLS", "IOS", "IP", "MAC", "NTP", "NXOS",
                "RADIUS", "SNMP", "SRX", "SSG", "SSH", "SSID", "TACACS", "TCP", "TLS", "VLAN",
              ]
            - - skip-initialism-name-checks: false

    misspell:
      locale: US

    perfsprint:
      int-conversion: true
      err-error: true
      errorf: true
      sprintf1: true

    paralleltest:
      ignore-missing: false

    tagliatelle:
      case:
        rules:
          json: snake

    govet:
      enable-all: true
      disable:
        - shadow # Noisy false positives
        - fieldalignment # Churn for marginal benefit

    sloglint:                    # See options: https://github.com/go-simpler/sloglint
      no-mixed-args: true        # Do not mix key/value pairs and Attrs
      no-global: ""              # Allow default global logger usage for simplicity

    copyloopvar:
      check-alias: true

    forbidigo:
      # analyze-types is on because the two package-qualified patterns below match source
      # text by default, so an aliased fmt or sort import would evade them.
      analyze-types: true
      forbid:
        - pattern: '^fmt\.Print.*$'
          msg: "write to an explicit io.Writer with fmt.Fprint*"
        - pattern: '^sort\.(Slice|SliceStable|Sort)$'
          msg: "use slices.SortStableFunc"

    depguard:
      rules:
        main:
          list-mode: lax
          files: [$all]
          deny:
            - pkg: "log$"
              desc: "This CLI logs through log/slog; the std log package writes to its own sink"
            # The anchor is load-bearing: depguard matches by prefix, so an unanchored
            # "encoding/json" would also ban encoding/json/v2 and encoding/json/jsontext.
            - pkg: "encoding/json$"
              desc: "Use encoding/json/v2; mixing v1 and v2 mixes their omitempty and nil-slice rules"
            - pkg: "github.com/pkg/errors$"
              desc: "Use the std errors package"
            - pkg: "math/rand$"
              desc: "Use math/rand/v2"
            - pkg: "golang.org/x/exp/maps$"
              desc: "Use the std maps package"
            - pkg: "golang.org/x/exp/slices$"
              desc: "Use the std slices package"

  ########################
  # 5. Exclusions
  ########################
  exclusions:
    generated: lax
    warn-unused: false
    paths:
      - tmp/
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - goconst
          - gosec
          - ineffassign
          - mnd
          - perfsprint
          - staticcheck
          - unused
          - tagliatelle
      # The flag env-var names are the CLI's public contract, so gosec's G101 word list
      # matches the constant that carries TELEE_PRIVPASSWORD rather than a secret.
      - path: ^internal/domain/flags\.go$
        text: "G101"
        linters:
          - gosec
      # --host-key-path names the file the operator chose; the variable is the point.
      - path: ^pkg/ssh/client\.go$
        text: "G304"
        linters:
          - gosec

########################
# 6. Formatters
########################
formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/umatare5/telee)
    gofumpt:
      extra:
        group-params: true

########################
# 7. Output
########################
output:
  show-stats: false
